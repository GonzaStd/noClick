<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>noClick — Character Spritesheet</title>
<style>
  :root {
    --tile: 24px;
    --spacing: 8px;
    --cols: 4;
    --rows: 4;
  }

  .spritesheet {
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--tile));
    grid-auto-rows: var(--tile);
    gap: var(--spacing);
    width: max-content;
    height: max-content;
  }

  .sprite {
    width: var(--tile);
    height: var(--tile);
    background-image: url("noclick_character_spritesheet_120x120.png");
    background-repeat: no-repeat;
    image-rendering: pixelated;
  }

  /* Source position of each tile in the 120×120 spritesheet */
  .s0 { background-position: 0 0; }
  .s1 { background-position: -32px 0; }
  .s2 { background-position: -64px 0; }
  .s3 { background-position: -96px 0; }

  .s4 { background-position: 0 -32px; }
  .s5 { background-position: -32px -32px; }
  .s6 { background-position: -64px -32px; }
  .s7 { background-position: -96px -32px; }

  .s8 { background-position: 0 -64px; }
  .s9 { background-position: -32px -64px; }
  .s10 { background-position: -64px -64px; }
  .s11 { background-position: -96px -64px; }

  .s12 { background-position: 0 -96px; }
  .s13 { background-position: -32px -96px; }
  .s14 { background-position: -64px -96px; }
  .s15 { background-position: -96px -96px; }

  .demo {
    transform-origin: top left;
    width: max-content;
  }
</style>
</head>
<body>
  <div class="demo">
    <div class="spritesheet">
      <div class="sprite s0"></div><div class="sprite s1"></div><div class="sprite s2"></div><div class="sprite s3"></div><div class="sprite s4"></div><div class="sprite s5"></div><div class="sprite s6"></div><div class="sprite s7"></div><div class="sprite s8"></div><div class="sprite s9"></div><div class="sprite s10"></div><div class="sprite s11"></div><div class="sprite s12"></div><div class="sprite s13"></div><div class="sprite s14"></div><div class="sprite s15"></div>
    </div>
  </div>
</body>
</html>
